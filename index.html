<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#010814">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JARVIS Mark VII</title>
  
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://js.puter.com/v2/"></script>

  <style>
    :root {
      --primary: #00f0ff;
      --primary-dim: rgba(0, 240, 255, 0.2);
      --primary-glow: rgba(0, 240, 255, 0.65);
      --accent-gold: #ffaa00;
      --accent-green: #00ffaa;
      --accent-red: #ff3344;
      --bg: #010814;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      background: radial-gradient(circle at center, #06203a 0%, #020c1a 60%, #00040a 100%);
      color: var(--primary);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 8px 10px 14px;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
      z-index: 1;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.4) 51%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.8;
    }

    .hud-corner {
      position: fixed;
      width: 26px;
      height: 26px;
      pointer-events: none;
      z-index: 8;
    }
    .hud-corner.tl { top: 6px; left: 6px; border-top: 2.5px solid var(--primary); border-left: 2.5px solid var(--primary); }
    .hud-corner.tr { top: 6px; right: 6px; border-top: 2.5px solid var(--primary); border-right: 2.5px solid var(--primary); }
    .hud-corner.bl { bottom: 6px; left: 6px; border-bottom: 2.5px solid var(--primary); border-left: 2.5px solid var(--primary); }
    .hud-corner.br { bottom: 6px; right: 6px; border-bottom: 2.5px solid var(--primary); border-right: 2.5px solid var(--primary); }

    /* BOOT SCREEN */
    #bootScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #0a2f58 0%, #030e1d 65%, #00040a 100%);
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .boot-laser-horiz {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00f0ff, transparent);
      box-shadow: 0 0 16px #00f0ff;
      animation: sweepVert 3s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes sweepVert {
      0% { top: 4%; opacity: 0.15; }
      50% { opacity: 0.9; }
      100% { top: 96%; opacity: 0.15; }
    }

    .boot-stage-container {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .boot-reactor-ring-1 {
      position: absolute;
      width: 190px;
      height: 190px;
      border: 1.5px dashed var(--primary);
      border-radius: 50%;
      animation: spinCW 14s linear infinite;
    }
    .boot-reactor-ring-2 {
      position: absolute;
      width: 155px;
      height: 155px;
      border: 2px solid rgba(0, 240, 255, 0.3);
      border-top-color: var(--primary);
      border-bottom-color: var(--primary);
      border-radius: 50%;
      animation: spinCCW 7s linear infinite;
    }
    .boot-reactor-ring-3 {
      position: absolute;
      width: 120px;
      height: 120px;
      border: 1px dotted rgba(255, 170, 0, 0.7);
      border-radius: 50%;
      animation: spinCW 5s linear infinite;
    }
    .boot-reactor-core {
      width: 72px;
      height: 72px;
      background: radial-gradient(circle, #ffffff 15%, #00f0ff 65%, rgba(0,240,255,0.2) 100%);
      border-radius: 50%;
      box-shadow: 0 0 50px var(--primary-glow), inset 0 0 16px #fff;
      animation: coreSwell 1.8s ease-in-out infinite alternate;
    }

    @keyframes spinCW { to { transform: rotate(360deg); } }
    @keyframes spinCCW { to { transform: rotate(-360deg); } }
    @keyframes coreSwell {
      from { transform: scale(0.92); box-shadow: 0 0 25px var(--primary-glow); }
      to { transform: scale(1.1); box-shadow: 0 0 75px #00f0ff, 0 0 20px #fff; }
    }

    .boot-title {
      font-family: 'Orbitron', monospace;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.45em;
      color: #effaff;
      text-shadow: 0 0 24px var(--primary-glow);
      margin-left: 0.45em;
    }
    .boot-subtitle {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.28em;
      color: rgba(0, 240, 255, 0.75);
      margin-top: 4px;
      text-transform: uppercase;
    }

    .boot-telemetry-panel {
      width: 330px;
      background: rgba(0, 24, 52, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 14px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.74rem;
      color: rgba(0, 240, 255, 0.85);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .boot-track-box {
      width: 330px;
      margin-top: 14px;
    }
    .boot-track {
      width: 100%;
      height: 8px;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 4px;
      overflow: hidden;
    }
    .boot-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0077ff, #00f0ff);
      box-shadow: 0 0 16px var(--primary);
      transition: width 0.9s cubic-bezier(0.2, 0.8, 0.3, 1);
    }
    .boot-text-readout {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      color: #92ecff;
      text-align: center;
      height: 20px;
      margin-top: 8px;
    }

    .btn-stark-init {
      margin-top: 18px;
      background: rgba(0, 240, 255, 0.12);
      border: 1.5px solid var(--primary);
      color: var(--primary);
      font-family: 'Orbitron', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      padding: 14px 34px;
      border-radius: 36px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 14px rgba(0, 240, 255, 0.2);
    }
    .btn-stark-init:active {
      transform: scale(0.96);
      background: rgba(0, 240, 255, 0.3);
    }

    /* HEADER */
    header {
      width: 100%;
      max-width: 460px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px 6px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.25);
      position: relative;
      z-index: 10;
    }
    .brand-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 0.22em;
      color: #fff;
      text-shadow: 0 0 12px var(--primary);
    }
    .brand-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: rgba(0, 240, 255, 0.7);
      letter-spacing: 0.12em;
    }
    .telemetry-time {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.82rem;
      color: var(--primary);
      text-align: right;
    }

    /* NAVIGATION RAIL */
    .tab-rail {
      width: 100%;
      max-width: 460px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin: 6px 0;
      position: relative;
      z-index: 10;
    }
    .tab-btn {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: rgba(0, 240, 255, 0.7);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      padding: 6px 2px;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      text-transform: uppercase;
    }
    .tab-btn.active {
      background: rgba(0, 240, 255, 0.25);
      border-color: var(--primary);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.35);
    }

    .deck-panel {
      width: 100%;
      max-width: 460px;
      display: none;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 10;
    }
    .deck-panel.active { display: flex; }

    /* TAB 1: HOME DECK */
    .hud-stage {
      position: relative;
      width: 320px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0;
    }
    .reticle-outer {
      position: absolute;
      width: 230px;
      height: 230px;
      border: 1px dashed rgba(0, 240, 255, 0.3);
      border-radius: 50%;
      animation: spinCW 32s linear infinite;
    }
    .reticle-mid {
      position: absolute;
      width: 200px;
      height: 200px;
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-left: 2px solid var(--primary);
      border-right: 2px solid var(--primary);
      border-radius: 50%;
      animation: spinCCW 16s linear infinite;
    }
    .reticle-inner {
      position: absolute;
      width: 165px;
      height: 165px;
      border: 1px dotted rgba(0, 240, 255, 0.4);
      border-radius: 50%;
    }
    .hud-pitch-ladder {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px 8px;
    }
    .pitch-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(0, 240, 255, 0.35);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem;
    }
    .pitch-line::before, .pitch-line::after {
      content: "";
      width: 24px;
      height: 1px;
      background: rgba(0, 240, 255, 0.4);
    }
    canvas#holoCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }
    .hud-flank-left, .hud-flank-right {
      position: absolute;
      top: 20px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem;
      line-height: 1.35;
      pointer-events: none;
      z-index: 6;
    }
    .hud-flank-left { left: 4px; text-align: left; color: rgba(0, 240, 255, 0.7); }
    .hud-flank-right { right: 4px; text-align: right; color: rgba(0, 240, 255, 0.7); }

    /* SUBTITLES */
    .subtitles-card {
      width: 100%;
      background: rgba(2, 12, 26, 0.9);
      border: 1.5px solid rgba(0, 240, 255, 0.45);
      border-radius: 12px;
      padding: 10px 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
      margin: 4px 0 8px;
    }
    .sub-channel { margin-bottom: 6px; }
    .sub-channel:last-child { margin-bottom: 0; }
    .sub-tag {
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      display: inline-block;
      margin-bottom: 2px;
    }
    .sub-tag.user { color: var(--accent-gold); }
    .sub-tag.jarvis { color: var(--primary); }
    .sub-text {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0.02em;
      min-height: 22px;
    }
    .sub-text.user { color: #ffe6aa; }
    .sub-text.jarvis { color: #ffffff; text-shadow: 0 0 8px rgba(0, 240, 255, 0.4); }

    /* CONSOLE */
    .hud-console {
      width: 100%;
      background: rgba(2, 12, 26, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 12px;
      padding: 10px 12px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .status-badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .state-indicator {
      font-family: 'Orbitron', monospace;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary-glow);
    }
    .system-dot {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--primary);
      animation: coreSwell 1s infinite alternate;
    }
    .tactical-drawer {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      margin-bottom: 6px;
    }
    .tactical-option-btn {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.28);
      color: rgba(225, 248, 255, 0.9);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      padding: 6px 10px;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tactical-option-btn:active {
      background: rgba(0, 240, 255, 0.28);
      border-color: var(--primary);
      transform: scale(0.98);
    }
    .chat-row { display: flex; gap: 6px; }
    .chat-input {
      flex: 1;
      background: rgba(0, 20, 40, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 8px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 8px 12px;
      outline: none;
    }
    .chat-input::placeholder {
      color: rgba(0, 240, 255, 0.45);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.74rem;
    }
    .chat-send-btn {
      background: rgba(0, 240, 255, 0.16);
      border: 1px solid var(--primary);
      color: var(--primary);
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 0 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    .chat-send-btn:active {
      background: var(--primary);
      color: #000;
    }

    /* TAB 2: COGNITION CHAT */
    .cognition-controls {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      background: rgba(0, 20, 40, 0.5);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }
    .mode-toggle-btn {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid var(--primary);
      color: var(--primary);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .chat-history-log {
      width: 100%;
      height: 380px;
      overflow-y: auto;
      background: rgba(2, 10, 20, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 8px;
    }
    .chat-entry {
      font-size: 0.95rem;
      line-height: 1.35;
      padding: 8px 10px;
      border-radius: 6px;
      max-width: 90%;
    }
    .chat-entry.user {
      align-self: flex-end;
      background: rgba(255, 170, 0, 0.12);
      border: 1px solid rgba(255, 170, 0, 0.35);
      color: #ffe6aa;
    }
    .chat-entry.jarvis {
      align-self: flex-start;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #ffffff;
    }

    /* TAB 3: HOLO-FABRICATOR */
    .holo-viewport {
      width: 100%;
      height: 280px;
      background: rgba(0, 16, 36, 0.8);
      border: 1.5px dashed var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .holo-viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .holo-placeholder {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      color: rgba(0, 240, 255, 0.6);
      text-align: center;
      padding: 20px;
    }
    .holo-laser-sweep {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #00ffaa;
      box-shadow: 0 0 15px #00ffaa;
      display: none;
      animation: sweepVert 2s ease-in-out infinite alternate;
    }

    /* TAB 4: INTEL RADAR */
    .radar-card-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .radar-card {
      background: rgba(0, 20, 45, 0.65);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      padding: 10px;
      font-family: 'Share Tech Mono', monospace;
    }
    .radar-card-title {
      font-size: 0.72rem;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }
    .radar-card-val {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }
    .radar-card-sub {
      font-size: 0.65rem;
      color: rgba(0, 240, 255, 0.6);
    }
  </style>
</head>
<body>

  <div class="hud-corner tl"></div>
  <div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div>
  <div class="hud-corner br"></div>

  <!-- 10-STAGE CINEMATIC DIAGNOSTIC BOOT SCREEN -->
  <div id="bootScreen">
    <div class="boot-laser-horiz"></div>

    <div class="boot-stage-container">
      <div class="boot-reactor-ring-1"></div>
      <div class="boot-reactor-ring-2"></div>
      <div class="boot-reactor-ring-3"></div>
      <div class="boot-reactor-core"></div>
    </div>

    <div class="boot-title">J.A.R.V.I.S.</div>
    <div class="boot-subtitle">STARK TACTICAL OPERATING SYSTEM</div>

    <div class="boot-track-box">
      <div class="boot-track">
        <div id="bootBar" class="boot-fill"></div>
      </div>
      <div id="bootStatus" class="boot-text-readout">PRESS INITIALIZE TO ENGAGE POWER</div>
    </div>

    <div class="boot-telemetry-panel">
      <div>REG // <span id="bootReg" style="color:#fff;">0x7FFE0014</span></div>
      <div>CORE FLUX // <span id="bootFlux" style="color:var(--accent-green);">STANDBY</span></div>
      <div>PRESSURE // <span id="bootPress" style="color:#fff;">1.01 BAR</span></div>
      <div>LINK // <span id="bootSat" style="color:var(--accent-gold);">ARMED</span></div>
    </div>

    <button id="powerOnBtn" class="btn-stark-init">INITIALIZE SUITE</button>
  </div>

  <!-- HUD BAR -->
  <header>
    <div>
      <div class="brand-title">J.A.R.V.I.S.</div>
      <div class="brand-sub">NEURAL OPERATING SUITE // MK VII</div>
    </div>
    <div>
      <div id="hudClock" class="telemetry-time">00:00:00 LOC</div>
      <div style="font-size: 0.65rem; color: rgba(0,240,255,0.65); text-align: right;">GRID // CYMRU CELL</div>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <div class="tab-rail">
    <button class="tab-btn active" onclick="switchTab('tabHome', this)">01 // HOME</button>
    <button class="tab-btn" onclick="switch
