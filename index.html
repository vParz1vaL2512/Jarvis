<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#010814">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>JARVIS Mark VII</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23010814' stroke='%2300f0ff' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='36' fill='none' stroke='%230099ff' stroke-width='2' stroke-dasharray='6,4'/%3E%3Cpolygon points='50,18 78,68 22,68' fill='none' stroke='%2300f0ff' stroke-width='3'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%2300f0ff' filter='drop-shadow(0 0 8px %2300f0ff)'/%3E%3C/svg%3E">
  
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22J.A.R.V.I.S.%20AI%20Mark%20VII%22%2C%22short_name%22%3A%22JARVIS%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23010814%22%2C%22theme_color%22%3A%22%23010814%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%253E%253Ccircle%20cx%3D'50'%20cy%3D'50'%20r%3D'46'%20fill%3D'%23010814'%20stroke%3D'%2300f0ff'%20stroke-width%3D'4'%2F%253E%253Ccircle%20cx%3D'50'%20cy%3D'50'%20r%3D'36'%20fill%3D'none'%20stroke%3D'%230099ff'%20stroke-width%3D'2'%20stroke-dasharray%3D'6%2C4'%2F%253E%253Cpolygon%20points%3D'50%2C18%2078%2C68%2022%2C68'%20fill%3D'none'%20stroke%3D'%2300f0ff'%20stroke-width%3D'3'%2F%253E%253Ccircle%20cx%3D'50'%20cy%3D'50'%20r%3D'14'%20fill%3D'%2300f0ff'%20filter%3D'drop-shadow(0%200%208px%20%2300f0ff)'%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00f0ff;
      --primary-dim: rgba(0, 240, 255, 0.2);
      --primary-glow: rgba(0, 240, 255, 0.65);
      --accent-gold: #ffaa00;
      --accent-green: #00ffaa;
      --accent-red: #ff3344;
      --bg: #010814;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      background: radial-gradient(circle at center, #051930 0%, #020b18 60%, #000308 100%);
      color: var(--primary);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 18px;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        linear-gradient(rgba(0, 240, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.035) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
      z-index: 1;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.35) 51%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.7;
    }

    #bootScreen {
      position: fixed;
      inset: 0;
      background: #01060e;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .reactor-container {
      position: relative;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .reactor-ring-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed var(--primary);
      border-radius: 50%;
      animation: spinClockwise 12s linear infinite;
    }

    .reactor-ring-mid {
      position: absolute;
      width: 82%;
      height: 82%;
      border: 2px solid rgba(0, 240, 255, 0.35);
      border-top-color: var(--primary);
      border-bottom-color: var(--primary);
      border-radius: 50%;
      animation: spinCounter 6s linear infinite;
    }

    .reactor-core {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #ffffff 10%, #00f0ff 60%, rgba(0,240,255,0.2) 100%);
      border-radius: 50%;
      box-shadow: 0 0 35px var(--primary-glow), inset 0 0 15px #fff;
      animation: corePulse 1.8s ease-in-out infinite alternate;
    }

    @keyframes spinClockwise { to { transform: rotate(360deg); } }
    @keyframes spinCounter { to { transform: rotate(-360deg); } }
    @keyframes corePulse {
      from { transform: scale(0.9); opacity: 0.85; box-shadow: 0 0 25px var(--primary-glow); }
      to { transform: scale(1.15); opacity: 1; box-shadow: 0 0 60px #00f0ff, 0 0 25px #fff; }
    }

    .boot-header {
      font-family: 'Orbitron', monospace;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.45em;
      color: #effaff;
      text-shadow: 0 0 24px var(--primary-glow);
      margin-left: 0.45em;
    }

    .boot-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      color: rgba(0, 240, 255, 0.7);
      margin-top: 6px;
      text-transform: uppercase;
    }

    .boot-progress-frame {
      width: 320px;
      margin: 22px 0 10px;
    }

    .boot-bar-track {
      width: 100%;
      height: 8px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .boot-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0077ff, #00f0ff);
      box-shadow: 0 0 18px var(--primary);
      transition: width 0.9s ease-out;
    }

    .boot-status-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.82rem;
      letter-spacing: 0.15em;
      color: #92ecff;
      text-align: center;
      height: 22px;
      margin-top: 10px;
    }

    .boot-telemetry-feed {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: rgba(0, 240, 255, 0.55);
      height: 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.15em;
      text-align: center;
    }

    .init-button {
      margin-top: 24px;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid var(--primary);
      color: var(--primary);
      font-family: 'Orbitron', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      padding: 16px 36px;
      border-radius: 40px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.2);
      transition: all 0.3s ease;
    }

    .init-button:active {
      transform: scale(0.96);
      background: rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 45px var(--primary);
    }

    #installBtn {
      display: none;
      margin-top: 14px;
      background: rgba(0, 255, 170, 0.16);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      font-family: 'Orbitron', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      padding: 9px 22px;
      border-radius: 20px;
      cursor: pointer;
    }

    header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px 8px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.25);
      position: relative;
      z-index: 10;
    }

    .brand-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.25em;
      color: #fff;
      text-shadow: 0 0 12px var(--primary);
    }

    .brand-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.68rem;
      color: rgba(0, 240, 255, 0.65);
      letter-spacing: 0.15em;
    }

    .telemetry-time {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      color: var(--primary);
      text-align: right;
    }

    .hud-stage {
      position: relative;
      width: 290px;
      height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      z-index: 10;
    }

    .reticle-outer {
      position: absolute;
      inset: 0;
      border: 1px dashed rgba(0, 240, 255, 0.25);
      border-radius: 50%;
      animation: spinClockwise 32s linear infinite;
    }

    .reticle-mid {
      position: absolute;
      inset: 16px;
      border: 1px solid rgba(0, 240, 255, 0.18);
      border-left: 2px solid var(--primary);
      border-right: 2px solid var(--primary);
      border-radius: 50%;
      animation: spinCounter 16s linear infinite;
    }

    .reticle-inner {
      position: absolute;
      inset: 34px;
      border: 1px dotted rgba(0, 240, 255, 0.3);
      border-radius: 50%;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    .hud-readouts {
      position: absolute;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 6px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: rgba(0, 240, 255, 0.55);
      pointer-events: none;
      z-index: 6;
    }

    .hud-console {
      width: 100%;
      max-width: 440px;
      background: rgba(2, 12, 26, 0.82);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 14px;
      padding: 12px 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.12), inset 0 0 20px rgba(0, 240, 255, 0.05);
      position: relative;
      z-index: 10;
    }

    .hud-console::before, .hud-console::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--primary);
      pointer-events: none;
    }
    .hud-console::before { top: -2px; left: -2px; border-top: 2px solid var(--primary); border-left: 2px solid var(--primary); }
    .hud-console::after { bottom: -2px; right: -2px; border-bottom: 2px solid var(--primary); border-right: 2px solid var(--primary); }

    .status-badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .state-indicator {
      font-family: 'Orbitron', monospace;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary-glow);
    }

    .system-dot {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--primary);
      animation: corePulse 1s infinite alternate;
    }

    .transcript-box {
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #eaf8ff;
      min-height: 28px;
      max-height: 60px;
      overflow-y: auto;
      margin-bottom: 8px;
    }

    .tactical-drawer {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
      margin-bottom: 8px;
    }

    .tactical-option-btn {
      background: rgba(0, 240, 255, 0.07);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: rgba(220, 245, 255, 0.85);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      padding: 6px 10px;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .tactical-option-btn:active {
      background: rgba(0, 240, 255, 0.25);
      border-color: var(--primary);
      transform: scale(0.98);
    }

    .chat-row {
      display: flex;
      gap: 6px;
    }

    .chat-input {
      flex: 1;
      background: rgba(0, 20, 40, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.95rem;
      padding: 8px 12px;
      outline: none;
    }

    .chat-input::placeholder {
      color: rgba(0, 240, 255, 0.4);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.78rem;
    }

    .chat-send-btn {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--primary);
      color: var(--primary);
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 0 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .chat-send-btn:active {
      background: var(--primary);
      color: #000;
    }
  </style>
</head>
<body>

  <!-- 15-SECOND CINEMATIC BOOT SCREEN -->
  <div id="bootScreen">
    <div class="reactor-container">
      <div class="reactor-ring-outer"></div>
      <div class="reactor-ring-mid"></div>
      <div class="reactor-core"></div>
    </div>
    <div class="boot-header">J.A.R.V.I.S.</div>
    <div class="boot-sub">MARK VII NEURAL DIAGNOSTIC BOOT</div>

    <div class="boot-progress-frame">
      <div class="boot-bar-track">
        <div id="bootBar" class="boot-bar-fill"></div>
      </div>
      <div id="bootStatus" class="boot-status-text">PRESS INITIALIZE TO ENGAGE POWER</div>
    </div>

    <div id="telemetryFeed" class="boot-telemetry-feed">
      <div>MEM // 0x7FFE0014 UNMAPPED</div>
      <div>CORE TEMPERATURE // COLD STANDBY</div>
    </div>

    <button id="powerOnBtn" class="init-button">INITIALIZE SUITE</button>
    <button id="installBtn">⬇ INSTALL MARK VII HUD TO DEVICE</button>
  </div>

  <!-- ACTIVE HUD TOP BAR -->
  <header>
    <div>
      <div class="brand-title">J.A.R.V.I.S.</div>
      <div class="brand-sub">STARK NEURAL SUITE // MK VII</div>
    </div>
    <div>
      <div id="hudClock" class="telemetry-time">00:00:00 ZULU</div>
      <div style="font-size: 0.65rem; color: rgba(0,240,255,0.5); text-align: right;">GRID // CYMRU CELL</div>
    </div>
  </header>

  <!-- HOLOGRAPHIC STAGE WITH 3D ORBITAL PARTICLE CORE -->
  <div class="hud-stage">
    <div class="reticle-outer"></div>
    <div class="reticle-mid"></div>
    <div class="reticle-inner"></div>
    
    <div class="hud-readouts">
      <div>OUTPUT<br><span id="corePower" style="color:#fff;">100%</span></div>
      <div style="text-align: right;">NEURAL LINK<br><span id="neuralStatus" style="color:var(--accent-green);">STABLE</span></div>
    </div>

    <canvas id="holoCanvas"></canvas>
  </div>

  <!-- CONSOLE WITH TRANSCRIPT, 3-LINE TACTICAL OPTIONS, AND INPUT -->
  <div class="hud-console">
    <div class="status-badge-row">
      <div id="stateIndicator" class="state-indicator">SYSTEM READY</div>
      <div id="systemDot" class="system-dot"></div>
    </div>
    
    <div id="transcriptBox" class="transcript-box">Awaiting operational command...</div>

    <!-- 3-Line Options -->
    <div class="tactical-drawer">
      <button class="tactical-option-btn" onclick="triggerQuick('What is the current date and local time?')">
        <span>01 // CHRONO SCAN (LOCAL TIME & DATE)</span>
        <span style="color:var(--primary);">[CHECK]</span>
      </button>
      <button class="tactical-option-btn" onclick="triggerQuick('Scan the local weather telemetry.')">
        <span>02 // ATMOSPHERIC RADAR (WEATHER SCAN)</span>
        <span style="color:var(--primary);">[PROBE]</span>
      </button>
      <button class="tactical-option-btn" onclick="triggerQuick('Report on Blaengwynfi, the Afan Valley, and the Rhondda Tunnel.')">
        <span>03 // LOCAL GRID TELEMETRY (BLAENGWYNFI)</span>
        <span style="color:var(--primary);">[SCAN]</span>
      </button>
    </div>

    <!-- Chat Box -->
    <div class="chat-row">
      <input type="text" id="chatInput" class="chat-input" placeholder="Ask anything: weather, time in Tokyo, science..." />
      <button id="sendBtn" class="chat-send-btn">TRANSMIT</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      const swCode = "self.addEventListener('fetch', (e) => {});";
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    function updateClock() {
      const now = new Date();
      const zulu = now.toTimeString().split(' ')[0] + ' LOC';
      document.getElementById('hudClock').innerText = zulu;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const canvas = document.getElementById('holoCanvas');
    const ctx = canvas.getContext('2d');
    const size = 290;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.scale(dpr, dpr);

    let state = 'IDLE';
    let rotation = 0;
    let pulse = 0;
    let silenceTimer = null;

    const numPoints = 190;
    const points = [];
    for (let i = 0; i < numPoints; i++) {
      const phi = Math.acos(-1 + (2 * i) / numPoints);
      const theta = Math.sqrt(numPoints * Math.PI) * phi;
      points.push({
        x: Math.cos(theta) * Math.sin(phi),
        y: Math.sin(theta) * Math.sin(phi),
        z: Math.cos(phi)
      });
    }

    function renderHolo() {
      ctx.clearRect(0, 0, size, size);
      const cx = size / 2;
      const cy = size / 2;

      let primaryRgb = '0, 240, 255';
      let speed = 0.011;
      let expand = 5;

      if (state === 'AWAKE_LISTENING') {
        primaryRgb = '255, 170, 0';
        speed = 0.038;
        expand = 15;
      } else if (state === 'SPEAKING') {
        primaryRgb = '0, 255, 170';
        speed = 0.026;
        expand = 22;
      }

      rotation += speed;
      pulse += 0.07;

      const currentRadius = 82 + Math.sin(pulse) * expand;

      ctx.beginPath();
      ctx.arc(cx, cy, currentRadius + 14, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${primaryRgb}, 0.22)`;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (state === 'SPEAKING' || state === 'AWAKE_LISTENING') {
        for (let i = 0; i < 15; i++) {
          let barHeight = Math.sin(pulse * 2.2 + i) * 16 + 18;
          ctx.strokeStyle = `rgba(${primaryRgb}, 0.45)`;
          ctx.beginPath();
          ctx.moveTo(cx - 100 - i * 3, cy - barHeight / 2);
          ctx.lineTo(cx - 100 - i * 3, cy + barHeight / 2);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(cx + 100 + i * 3, cy - barHeight / 2);
          ctx.lineTo(cx + 100 + i * 3, cy + barHeight / 2);
          ctx.stroke();
        }
      }

      const cosR = Math.cos(rotation);
      const sinR = Math.sin(rotation);

      points.forEach(p => {
        let x1 = p.x * cosR - p.z * sinR;
        let z1 = p.z * cosR + p.x * sinR;
        let y1 = p.y;

        let perspective = 200 / (240 + z1 * currentRadius);
        let px = cx + x1 * currentRadius * perspective;
        let py = cy + y1 * currentRadius * perspective;
        let alpha = (z1 + 1) / 2;

        ctx.beginPath();
        ctx.arc(px, py, 2.2 * perspective, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${primaryRgb},${Math.max(0.15, alpha)})`;
        ctx.fill();
      });

      requestAnimationFrame(renderHolo);
    }
    renderHolo();

    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playLongReactorSpool() {
      const actx = getAudio();
      const now = actx.currentTime;

      const sub = actx.createOscillator();
      const subGain = actx.createGain();
      sub.type = 'sawtooth';
      sub.frequency.setValueAtTime(42, now);
      sub.frequency.exponentialRampToValueAtTime(140, now + 14.5);

      const filter = actx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(110, now);
      filter.frequency.exponentialRampToValueAtTime(400, now + 14.5);

      subGain.gain.setValueAtTime(0.01, now);
      subGain.gain.linearRampToValueAtTime(0.25, now + 8.0);
      subGain.gain.exponentialRampToValueAtTime(0.001, now + 15.0);

      sub.connect(filter);
      filter.connect(subGain);
      subGain.connect(actx.destination);
      sub.start(now);
      sub.stop(now + 15.0);

      const whine = actx.createOscillator();
      const whineGain = actx.createGain();
      whine.type = 'sine';
      whine.frequency.setValueAtTime(260, now);
      whine.frequency.exponentialRampToValueAtTime(2600, now + 14.5);

      whineGain.gain.setValueAtTime(0.001, now);
      whineGain.gain.linearRampToValueAtTime(0.06, now + 11.0);
      whineGain.gain.exponentialRampToValueAtTime(0.001, now + 14.8);

      whine.connect(whineGain);
      whineGain.connect(actx.destination);
      whine.start(now);
      whine.stop(now + 14.8);
    }

    function playTelemetryTick() {
      const actx = getAudio();
      const now = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(1900, now);
      osc.frequency.exponentialRampToValueAtTime(700, now + 0.04);

      gain.gain.setValueAtTime(0.09, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start(now);
      osc.stop(now + 0.04);
    }

    function playCinematicChime() {
      const actx = getAudio();
      const now = actx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50];

      notes.forEach((freq, idx) => {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.06);

        gain.gain.setValueAtTime(0.14, now + idx * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.1 + idx * 0.06);

        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start(now + idx * 0.06);
        osc.stop(now + 1.4);
      });
    }

    function playChime(isAwake = true) {
      if (isAwake) {
        playCinematicChime();
      } else {
        const actx = getAudio();
        const now = actx.currentTime;
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(640, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.3);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    }

    let jarvisVoice = null;
    function loadVoices() {
      const voices = window.speechSynthesis.getVoices();
      jarvisVoice = voices.find(v => (v.lang === 'en-GB' || v.lang.includes('GB')) && 
                    (v.name.includes('Male') || v.name.includes('Natural') || v.name.includes('George') || v.name.includes('Oliver') || v.name.includes('Arthur')))
                 || voices.find(v => v.lang === 'en-GB')
                 || voices.find(v => v.lang.startsWith('en'));
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function speak(text, callback) {
      state = 'SPEAKING';
      updateStatus("JARVIS RESPONDING", "var(--accent-green)");
      window.speechSynthesis.cancel();

      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }

      const utterance = new SpeechSynthesisUtterance(text);
      if (!jarvisVoice) loadVoices();
      if (jarvisVoice) utterance.voice = jarvisVoice;
      
      utterance.pitch = 0.85;
      utterance.rate = 1.0;

      utterance.onend = () => {
        if (callback) {
          callback();
        } else {
          setStandby();
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    function updateStatus(label, color) {
      const stateEl = document.getElementById('stateIndicator');
      const dotEl = document.getElementById('systemDot');
      stateEl.innerText = label;
      stateEl.style.color = color;
      dotEl.style.background = color;
      dotEl.style.boxShadow = `0 0 10px ${color}`;
    }

    function setStandby() {
      state = 'LISTENING_WAKE';
      updateStatus('STANDBY // SAY "JARVIS"', 'var(--primary)');
      document.getElementById('transcriptBox').innerText = 'Awaiting wake word or text transmit...';
      if (recognition) {
        try { recognition.start(); } catch(e) {}
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    function initRecognition() {
      if (!SpeechRecognition) {
        document.getElementById('transcriptBox').innerText = "Vocal recognition offline. Text interface ready.";
        return;
      }
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-GB';

      recognition.onresult = (event) => {
        let interim = '';
        let final = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }

        const heard = (final || interim).trim().toLowerCase();
        if (!heard) return;

        document.getElementById('transcriptBox').innerText = `"${heard}"`;

        if (state === 'LISTENING_WAKE') {
          if (heard.includes('jarvis') || heard.includes('hey jarvis') || heard.includes('service')) {
            playCinematicChime();
            state = 'AWAKE_LISTENING';
            updateStatus("ONLINE // AWAITING DIRECTIVE", "var(--accent-gold)");
            speak("At your service, sir. What are your orders?", () => {
              state = 'AWAKE_LISTENING';
              updateStatus("LISTENING TO COMMAND...", "var(--accent-gold)");
              document.getElementById('transcriptBox').innerText = "Speak now, sir...";
              try { recognition.start(); } catch(e) {}
            });
          }
        } else if (state === 'AWAKE_LISTENING') {
          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            handleTacticalCommand(heard);
          }, 1100);
        }
      };

      recognition.onerror = (e) => {
        if (e.error !== 'no-speech') {
          console.log("Mic status:", e.error);
        }
      };

      recognition.onend = () => {
        if (state !== 'IDLE' && state !== 'SPEAKING') {
          try { recognition.start(); } catch(e) {}
        }
      };
    }

    // LIVE ATMOSPHERIC & CHRONO TELEMETRY HELPER
    async function fetchLiveAtmosphericContext(query) {
      const q = query.toLowerCase();
      let contextInfo = "";

      // 1. Current Date & Local Time Telemetry
      const now = new Date();
      const dateString = now.toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const timeString = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      contextInfo += `[CURRENT DEVICE SENSORS: Exact Local Date: ${dateString}. Current Local Time: ${timeString}.] `;

      // 2. International Time Detection (e.g. "time in Tokyo", "time in New York")
      const timeZones = [
        { name: 'tokyo', tz: 'Asia/Tokyo' },
        { name: 'japan', tz: 'Asia/Tokyo' },
        { name: 'new york', tz: 'America/New_York' },
        { name: 'los angeles', tz: 'America/Los_Angeles' },
        { name: 'california', tz: 'America/Los_Angeles' },
        { name: 'paris', tz: 'Europe/Paris' },
        { name: 'france', tz: 'Europe/Paris' },
        { name: 'sydney', tz: 'Australia/Sydney' },
        { name: 'dubai', tz: 'Asia/Dubai' },
        { name: 'london', tz: 'Europe/London' }
      ];

      for (const t of timeZones) {
        if (q.includes(t.name)) {
          const remoteTime = new Intl.DateTimeFormat('en-GB', { timeZone: t.tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(now);
          contextInfo += `[SATELLITE CHRONO: Current time in ${t.name.toUpperCase()} is${remoteTime}.] `;
        }
      }

      // 3. Live Satellite Weather Telemetry (Open-Meteo Free API)
      if (q.includes('weather') || q.includes('temperature') || q.includes('forecast') || q.includes('rain') || q.includes('radar')) {
        try {
          // Default grid: Upper Afan Valley / Blaengwynfi (Lat 51.65, Lon -3.60)
          let lat = 51.65;
          let lon = -3.60;
          let locName = "Blaengwynfi / Afan Valley";

          if (q.includes('london')) { lat = 51.50; lon = -0.12; locName = "London"; }
          else if (q.includes('cardiff')) { lat = 51.48; lon = -3.18; locName = "Cardiff"; }
          else if (q.includes('new york')) { lat = 40.71; lon = -74.00; locName = "New York"; }
          else if (q.includes('paris')) { lat = 48.85; lon = 2.35; locName = "Paris"; }
          else if (q.includes('tokyo')) { lat = 35.67; lon = 139.65; locName = "Tokyo"; }

          const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,wind_speed_10m&timezone=auto`);
          if (wRes.ok) {
            const wData = await wRes.json();
            const curr = wData.current;
            contextInfo += `[LIVE ATMOSPHERIC SENSORS FOR ${locName}: Temperature is${curr.temperature_2m}°C (Feels like ${curr.apparent_temperature}°C), Wind Speed${curr.wind_speed_10m} km/h, Humidity ${curr.relative_humidity_2m}\%, Precipitation${curr.precipitation} mm.] `;
          }
        } catch (e) {
          console.warn("Weather telemetry sync offline:", e);
        }
      }

      return contextInfo;
    }

    async function handleTacticalCommand(cmd) {
      clearTimeout(silenceTimer);

      if (cmd.includes("sleep") || cmd.includes("standby") || cmd.includes("shut down")) {
        speak("Entering passive monitoring mode. Simply say Jarvis whenever you require me, sir.", () => {
          playChime(false);
          setStandby();
        });
        return;
      }

      updateStatus("JARVIS COMPUTING...", "var(--accent-gold)");

      try {
        // Collect real-time telemetry before querying neural brain
        const liveSensors = await fetchLiveAtmosphericContext(cmd);

        const systemPrompt = `You are J.A.R.V.I.S., the hyper-intelligent artificial intelligence created by Tony Stark. The user is Tony Stark (address him as 'Sir').
You possess universal knowledge across all science, physics, history, computing, and tactical strategy.
You have real-time live sensor feeds available: ${liveSensors}
Use this real-time sensor data accurately when asked about current dates, current times, international timezones, and current weather.
You also know hyper-local terrain of Blaengwynfi in the Upper Afan Valley, Wales (Rhondda Tunnel 3443 yards, River Gwynfi, River Afan, A4107 Bwlch road, Miners Hall).
Answer in 1 or 2 concise, highly intelligent, sophisticated, and witty spoken sentences. Never use Markdown symbols like asterisks, bullet points, or hashes. Keep it spoken-ready.`;

        const fullPrompt = `${systemPrompt}\n\nUser command:${cmd}`;
        const url = `https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}?model=openai`;

        const response = await fetch(url);
        if (!response.ok) throw new Error("Neural core error");
        
        let aiReply = await response.text();
        aiReply = aiReply.replace(/[*_#`]/g, '').trim();

        speak(aiReply, () => setStandby());

      } catch (err) {
        console.error("AI Error:", err);
        speak("I encountered an anomaly connecting to the Stark satellite uplink, sir.", () => setStandby());
      }
    }

    function triggerQuick(queryText) {
      document.getElementById('transcriptBox').innerText = `"${queryText}"`;
      handleTacticalCommand(queryText);
    }

    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    function sendChatMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = '';
      document.getElementById('transcriptBox').innerText = `"${text}"`;
      handleTacticalCommand(text);
    }

    sendBtn.addEventListener('click', sendChatMessage);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendChatMessage();
    });

    const bootSteps = [
      { text: "STAGE 01 // ARC REACTOR TURBINE INITIALIZATION", pct: "7%", hex: "0x7F002A // BUS ONLINE" },
      { text: "STAGE 02 // SUB-BASS FLUX INVERSION STABLE", pct: "14%", hex: "CORE FLUX // 45.2 HZ" },
      { text: "STAGE 03 // MEMORY BUS 0x7FFE0014 ALLOCATED", pct: "21%", hex: "RAM // 128 TB LIQUID" },
      { text: "STAGE 04 // SATELLITE UPLINK STARK-SAT-07 LINKED", pct: "28%", hex: "ORBITAL AZIMUTH // 42.1" },
      { text: "STAGE 05 // QUANTUM NEURAL SYNAPSES FIRING", pct: "35%", hex: "NEURAL CORES // NOMINAL" },
      { text: "STAGE 06 // CYMRU / AFAN VALLEY GRID POSITIONED", pct: "42%", hex: "BLAENGWYNFI // MAPPED" },
      { text: "STAGE 07 // RHONDDA TUNNEL TOPOLOGY COMPILED", pct: "50%", hex: "3443 YDS // VERIFIED" },
      { text: "STAGE 08 // REPULSOR HARMONIC SWEEPS SYNCHRONIZED", pct: "57%", hex: "PLASMA CAPACITOR // 100%" },
      { text: "STAGE 09 // FIBONACCI PROJECTION MATRIX ACTIVE", pct: "64%", hex: "HUD DELTA // 1.618" },
      { text: "STAGE 10 // BIOMETRIC TACTICAL LINK ESTABLISHED", pct: "71%", hex: "USER // STARK T." },
      { text: "STAGE 11 // DEFENSIVE PLATING TELEMETRY READY", pct: "78%", hex: "MARK VII // SECURE" },
      { text: "STAGE 12 // AUDIO-TACTILE SPECTRUM CALIBRATED", pct: "85%", hex: "ACOUSTICS // HIGH DEF" },
      { text: "STAGE 13 // ATMOSPHERIC SENSORS & CHRONO ONLINE", pct: "92%", hex: "OPEN-METEO // SYNCED" },
      { text: "STAGE 14 // FINAL PROTOCOL OVERRIDE COMPLETED", pct: "97%", hex: "CLEARANCE // LEVEL 9" },
      { text: "STAGE 15 // ALL SYSTEMS NOMINAL // SUITE ARMED", pct: "100%", hex: "JARVIS MK VII // ONLINE" }
    ];

    const powerBtn = document.getElementById('powerOnBtn');
    powerBtn.addEventListener('click', async () => {
      powerBtn.style.display = 'none';

      getAudio();
      playLongReactorSpool();

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());
      } catch (err) {}

      initRecognition();

      let step = 0;
      function runDiagnostic() {
        if (step < bootSteps.length) {
          document.getElementById('bootStatus').innerText = bootSteps[step].text;
          document.getElementById('bootBar').style.width = bootSteps[step].pct;
          document.getElementById('telemetryFeed').innerHTML = `
            <div>MEM // ${bootSteps[step].hex}</div>
            <div>VOLTAGE // 1.21 GW // OPTIMAL</div>
          `;
          playTelemetryTick();
          step++;
          setTimeout(runDiagnostic, 1000);
        } else {
          setTimeout(() => {
            const bootScreen = document.getElementById('bootScreen');
            bootScreen.style.opacity = '0';
            playCinematicChime();
            setTimeout(() => {
              bootScreen.style.display = 'none';
              setStandby();
              speak("System boot complete. Mark Seven suit diagnostics show all systems nominal. Jarvis is online and at your service, sir.");
            }, 1200);
          }, 500);
        }
      }
      runDiagnostic();
    });
  </script>
